<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="240" height="280">
  <defs>
    <linearGradient id="armGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90d9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c5f8a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="jointGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5aa0e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3a70a0;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- 底座 -->
  <rect x="80" y="240" width="80" height="25" rx="4" fill="#3a70a0" stroke="#1a3a5c" stroke-width="2"/>
  <rect x="90" y="230" width="60" height="15" rx="3" fill="#4a90d9" stroke="#1a3a5c" stroke-width="2"/>
  <!-- 第一关节（底座旋转） -->
  <circle cx="120" cy="225" r="15" fill="url(#jointGrad)" stroke="#1a3a5c" stroke-width="2"/>
  <circle cx="120" cy="225" r="6" fill="#00d4ff"/>
  <!-- 大臂 -->
  <rect x="108" y="160" width="24" height="70" rx="6" fill="url(#armGrad)" stroke="#1a3a5c" stroke-width="2" transform="rotate(-20, 120, 195)"/>
  <!-- 第二关节（肩部） -->
  <circle cx="120" cy="155" r="14" fill="url(#jointGrad)" stroke="#1a3a5c" stroke-width="2"/>
  <circle cx="120" cy="155" r="5" fill="#00d4ff"/>
  <!-- 小臂 -->
  <rect x="145" y="100" width="22" height="65" rx="6" fill="url(#armGrad)" stroke="#1a3a5c" stroke-width="2" transform="rotate(35, 156, 132)"/>
  <!-- 第三关节（肘部） -->
  <circle cx="165" cy="95" r="12" fill="url(#jointGrad)" stroke="#1a3a5c" stroke-width="2"/>
  <circle cx="165" cy="95" r="4" fill="#00d4ff"/>
  <!-- 腕部 -->
  <rect x="170" y="55" width="18" height="45" rx="5" fill="url(#armGrad)" stroke="#1a3a5c" stroke-width="2" transform="rotate(10, 179, 77)"/>
  <!-- 第四关节（腕部） -->
  <circle cx="178" cy="50" r="10" fill="url(#jointGrad)" stroke="#1a3a5c" stroke-width="2"/>
  <circle cx="178" cy="50" r="3" fill="#00d4ff"/>
  <!-- 末端执行器（夹爪） -->
  <rect x="170" y="25" width="6" height="25" rx="2" fill="#3a70a0" stroke="#1a3a5c" stroke-width="1"/>
  <rect x="182" y="25" width="6" height="25" rx="2" fill="#3a70a0" stroke="#1a3a5c" stroke-width="1"/>
  <!-- 标注 -->
  <text x="120" y="275" text-anchor="middle" fill="#8899aa" font-size="10">示意图 · 原创设计</text>
</svg>