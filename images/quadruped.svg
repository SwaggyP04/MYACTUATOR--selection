<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 220" width="280" height="220">
  <defs>
    <linearGradient id="dogBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90d9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c5f8a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dogLimbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5aa0e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3a70a0;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- 身体 -->
  <ellipse cx="140" cy="90" rx="80" ry="35" fill="url(#dogBodyGrad)" stroke="#1a3a5c" stroke-width="2"/>
  <!-- 头部 -->
  <ellipse cx="220" cy="75" rx="30" ry="25" fill="url(#dogBodyGrad)" stroke="#1a3a5c" stroke-width="2"/>
  <!-- 眼睛 -->
  <circle cx="230" cy="70" r="4" fill="#00d4ff"/>
  <circle cx="215" cy="70" r="4" fill="#00d4ff"/>
  <!-- 鼻子 -->
  <ellipse cx="245" cy="78" rx="6" ry="4" fill="#1a3a5c"/>
  <!-- 耳朵 -->
  <polygon points="205,55 215,40 225,55" fill="#3a70a0" stroke="#1a3a5c" stroke-width="1"/>
  <!-- 尾巴 -->
  <rect x="50" y="75" width="25" height="8" rx="4" fill="#3a70a0" stroke="#1a3a5c" stroke-width="1" transform="rotate(-20, 62, 79)"/>
  <!-- 左前腿 -->
  <rect x="175" y="115" width="14" height="40" rx="4" fill="url(#dogLimbGrad)" stroke="#1a3a5c" stroke-width="2"/>
  <circle cx="182" cy="158" r="8" fill="#3a70a0" stroke="#1a3a5c" stroke-width="2"/>
  <rect x="177" y="162" width="10" height="30" rx="3" fill="url(#dogLimbGrad)" stroke="#1a3a5c" stroke-width="2"/>
  <ellipse cx="182" cy="195" rx="10" ry="5" fill="#1a3a5c"/>
  <!-- 右前腿 -->
  <rect x="195" y="115" width="14" height="40" rx="4" fill="url(#dogLimbGrad)" stroke="#1a3a5c" stroke-width="2"/>
  <circle cx="202" cy="158" r="8" fill="#3a70a0" stroke="#1a3a5c" stroke-width="2"/>
  <rect x="197" y="162" width="10" height="30" rx="3" fill="url(#dogLimbGrad)" stroke="#1a3a5c" stroke-width="2"/>
  <ellipse cx="202" cy="195" rx="10" ry="5" fill="#1a3a5c"/>
  <!-- 左后腿 -->
  <rect x="85" y="115" width="14" height="40" rx="4" fill="url(#dogLimbGrad)" stroke="#1a3a5c" stroke-width="2"/>
  <circle cx="92" cy="158" r="8" fill="#3a70a0" stroke="#1a3a5c" stroke-width="2"/>
  <rect x="87" y="162" width="10" height="30" rx="3" fill="url(#dogLimbGrad)" stroke="#1a3a5c" stroke-width="2"/>
  <ellipse cx="92" cy="195" rx="10" ry="5" fill="#1a3a5c"/>
  <!-- 右后腿 -->
  <rect x="65" y="115" width="14" height="40" rx="4" fill="url(#dogLimbGrad)" stroke="#1a3a5c" stroke-width="2"/>
  <circle cx="72" cy="158" r="8" fill="#3a70a0" stroke="#1a3a5c" stroke-width="2"/>
  <rect x="67" y="162" width="10" height="30" rx="3" fill="url(#dogLimbGrad)" stroke="#1a3a5c" stroke-width="2"/>
  <ellipse cx="72" cy="195" rx="10" ry="5" fill="#1a3a5c"/>
  <!-- 背部传感器 -->
  <rect x="120" y="50" width="40" height="12" rx="3" fill="#3a70a0" stroke="#1a3a5c" stroke-width="1"/>
  <circle cx="140" cy="56" r="4" fill="#00d4ff"/>
  <!-- 标注 -->
  <text x="140" y="215" text-anchor="middle" fill="#8899aa" font-size="10">示意图 · 原创设计</text>
</svg>