<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 280" width="220" height="280">
  <defs>
    <linearGradient id="handGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90d9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c5f8a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="fingerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5aa0e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3a70a0;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- 手掌 -->
  <rect x="60" y="120" width="100" height="90" rx="15" fill="url(#handGrad)" stroke="#1a3a5c" stroke-width="2"/>
  <!-- 手腕 -->
  <rect x="80" y="205" width="60" height="35" rx="8" fill="#3a70a0" stroke="#1a3a5c" stroke-width="2"/>
  <rect x="90" y="235" width="40" height="20" rx="5" fill="#2c5f8a" stroke="#1a3a5c" stroke-width="2"/>
  <!-- 拇指 -->
  <rect x="35" y="140" width="22" height="55" rx="8" fill="url(#fingerGrad)" stroke="#1a3a5c" stroke-width="2" transform="rotate(-30, 46, 167)"/>
  <circle cx="40" cy="195" r="8" fill="#3a70a0" stroke="#1a3a5c" stroke-width="2"/>
  <rect x="30" y="198" width="18" height="35" rx="7" fill="url(#fingerGrad)" stroke="#1a3a5c" stroke-width="2" transform="rotate(-40, 39, 215)"/>
  <!-- 食指 -->
  <rect x="65" y="70" width="18" height="60" rx="7" fill="url(#fingerGrad)" stroke="#1a3a5c" stroke-width="2"/>
  <circle cx="74" cy="132" r="7" fill="#3a70a0" stroke="#1a3a5c" stroke-width="2"/>
  <rect x="66" y="137" width="16" height="40" rx="6" fill="url(#fingerGrad)" stroke="#1a3a5c" stroke-width="2"/>
  <circle cx="74" cy="180" r="6" fill="#3a70a0" stroke="#1a3a5c" stroke-width="2"/>
  <rect x="67" y="184" width="14" height="25" rx="5" fill="url(#fingerGrad)" stroke="#1a3a5c" stroke-width="2"/>
  <!-- 中指 -->
  <rect x="90" y="50" width="18" height="65" rx="7" fill="url(#fingerGrad)" stroke="#1a3a5c" stroke-width="2"/>
  <circle cx="99" cy="117" r="7" fill="#3a70a0" stroke="#1a3a5c" stroke-width="2"/>
  <rect x="91" y="122" width="16" height="42" rx="6" fill="url(#fingerGrad)" stroke="#1a3a5c" stroke-width="2"/>
  <circle cx="99" cy="167" r="6" fill="#3a70a0" stroke="#1a3a5c" stroke-width="2"/>
  <rect x="92" y="171" width="14" height="28" rx="5" fill="url(#fingerGrad)" stroke="#1a3a5c" stroke-width="2"/>
  <!-- 无名指 -->
  <rect x="115" y="60" width="18" height="62" rx="7" fill="url(#fingerGrad)" stroke="#1a3a5c" stroke-width="2"/>
  <circle cx="124" cy="124" r="7" fill="#3a70a0" stroke="#1a3a5c" stroke-width="2"/>
  <rect x="116" y="129" width="16" height="40" rx="6" fill="url(#fingerGrad)" stroke="#1a3a5c" stroke-width="2"/>
  <circle cx="124" cy="172" r="6" fill="#3a70a0" stroke="#1a3a5c" stroke-width="2"/>
  <rect x="117" y="176" width="14" height="26" rx="5" fill="url(#fingerGrad)" stroke="#1a3a5c" stroke-width="2"/>
  <!-- 小指 -->
  <rect x="140" y="80" width="16" height="50" rx="6" fill="url(#fingerGrad)" stroke="#1a3a5c" stroke-width="2"/>
  <circle cx="148" cy="132" r="6" fill="#3a70a0" stroke="#1a3a5c" stroke-width="2"/>
  <rect x="141" y="136" width="14" height="32" rx="5" fill="url(#fingerGrad)" stroke="#1a3a5c" stroke-width="2"/>
  <circle cx="148" cy="171" r="5" fill="#3a70a0" stroke="#1a3a5c" stroke-width="2"/>
  <rect x="142" y="174" width="12" height="20" rx="4" fill="url(#fingerGrad)" stroke="#1a3a5c" stroke-width="2"/>
  <!-- 掌心传感器 -->
  <circle cx="110" cy="155" r="10" fill="#00d4ff" opacity="0.6"/>
  <circle cx="110" cy="155" r="5" fill="#ffffff"/>
  <!-- 标注 -->
  <text x="110" y="270" text-anchor="middle" fill="#8899aa" font-size="10">示意图 · 原创设计</text>
</svg>